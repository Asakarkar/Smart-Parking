spring.application.name=smart-parking
server.port=${SERVER_PORT:8080}

# --- Database (values come from environment variables; no secrets in code) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate: Flyway owns the schema, Hibernate only validates it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# --- App settings ---
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Swagger UI: http://localhost:8080/swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
